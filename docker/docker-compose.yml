services:
  ipv6-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "1080:1080"
      - "3000:3000"
    environment:
      - API_KEY=changeme
      - DEFAULT_SUBNET=
      # Host NIC prefixes stay out of the pool unless this is true. An address
      # the upstream does not route back shows up as a 30s connect timeout.
      # - DETECT_HOST_SUBNETS=true
      - LOG_LEVEL=info
      # --- IPv6 via a free tunnel broker -----------------------------------
      # A host with no IPv6 of its own can still run this proxy: tunnelbroker.net
      # routes a /48 over a 6in4 tunnel, and the proxy sets that tunnel up.
      # Hand it credentials and the tunnel id, and it reads the rest from the API
      # and keeps the endpoint pointed at this host's current public IPv4.
      # - HE_TUNNEL_ID=1033580
      # - HE_TUNNEL_USERNAME=your-he-account
      # - HE_TUNNEL_PASSWORD=your-he-password
      # If the tunnel has an Update Key set (Advanced tab), use it instead:
      # - HE_TUNNEL_UPDATE_KEY=your-update-key
      #
      # Or paste the tunnel details and skip the API entirely:
      # - HE_TUNNEL_SERVER_IPV4=216.218.221.42
      # - HE_TUNNEL_CLIENT_IPV6=2001:470:35:380::2/64
      # - HE_TUNNEL_ROUTED_PREFIXES=2001:470:ecf2::/48,2001:470:36:37f::/64
      #
      # Behind NAT, point the tunnel at the LAN address and forward protocol 41:
      # - HE_TUNNEL_LOCAL_IPV4=192.168.1.20
      # ---------------------------------------------------------------------
      # --- IPv6 via Cloudflare WARP ----------------------------------------
      # The other way to get free IPv6 on a host that has none, and the one
      # that needs no signup at all: the proxy registers WARP devices itself.
      # Each device is one WireGuard link and one egress IPv6 address, so raise
      # WARP_ACCOUNTS to get a pool to rotate across. Needs the wireguard
      # kernel module on the HOST: modprobe wireguard.
      # - WARP_ENABLED=true
      # - WARP_ACCOUNTS=8
      # A WARP+ licence key raises the quota; the free tier still gets IPv6.
      # - WARP_LICENSE=xxxxxxxx-xxxx-xxxx-xxxxxxxxxxxx
      # Registrations are stored in /data and reused, so restarts keep the same
      # addresses. Set this once to deliberately rotate to new ones.
      # - WARP_RESET=true
      # ---------------------------------------------------------------------
      # Names without an AAAA record are reached through their CDN's
      # dual-stack edge fleet. On by default; see the README for the full set.
      # - CDN_FALLBACK_ENABLED=true
      # Use public resolvers when the local one strips AAAA records.
      # - CDN_FALLBACK_RESOLVERS=1.1.1.1,8.8.8.8
      # Pin known-good edges instead of discovering them.
      # - CDN_FALLBACK_EDGES=cloudfront=2600:9000:2015:1600::1
      # Reach IPv4-only origins through a NAT64 gateway (opt-in).
      # - NAT64_PREFIX=64:ff9b::/96
    volumes:
      - ./data:/data
      # Only needed if the host has not loaded the sit / wireguard modules
      # itself; lets the container modprobe them (with cap_add SYS_MODULE below).
      # - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE
    # network_mode: host means compose sysctls: are ignored — set on the HOST:
    #   sysctl -w net.ipv6.ip_nonlocal_bind=1
    #   echo net.ipv6.ip_nonlocal_bind=1 | tee /etc/sysctl.d/99-ipv6-proxy.conf
    restart: unless-stopped
    network_mode: host
